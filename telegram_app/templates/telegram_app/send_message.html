{% extends 'homepage/base_home.html' %}

{% block title %}Telegram - Littlecapa{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px;">
    <div class="row justify-content-center mt-5 mb-5">
        <div class="col-12">
            <h1 class="mb-4">Telegram-Nachricht senden</h1>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-4">
                    {{ form.message }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" name="action" value="send" class="btn btn-primary">Senden</button>
                    <button type="submit" name="action" value="cancel" formnovalidate class="btn btn-outline-secondary">Abbrechen</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

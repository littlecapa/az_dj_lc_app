name: 'Daily: Update Asset Prices'

on:
  schedule:
    - cron: '0 8,11,14,17 * * 1-5'  # Mo-Fr: 08/11/14/17 UTC (= 10/13/16/19 Uhr MESZ, innerhalb XETRA-Handelszeit)
  workflow_dispatch:
    inputs:
      asset_class:
        description: 'Einzelne Asset-Klasse (leer = alle)'
        required: false
        type: choice
        options:
          - ''
          - STOCK
          - ETF
          - ETC
          - CRYPTO
          - DERIVATIVE
          - FOND
      isin:
        description: 'Nur diese ISIN aktualisieren (leer = alle passenden)'
        required: false
        type: string
      force:
        description: 'Nur mit isin: Plausibilitäts-Check überspringen, Kurs sofort übernehmen'
        required: false
        type: boolean
        default: false

jobs:
  update-prices:
    name: 'Kurse aktualisieren'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # normale Läufe dauern 2-4 Min. — verhindert stundenlanges Hängen bei Mirror-Ausfall

    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: azureproject.production
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FINTECH_API_KEY: ${{ secrets.FINTECH_API_KEY }}
      AlphaVantage_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.9'

      - name: Install ODBC Driver for SQL Server
        run: |
          # curl/gnupg sind auf ubuntu-latest bereits vorinstalliert — kein
          # eigenes "apt-get update && apt-get install" davor nötig, das war
          # ein zweiter unnötiger Kontakt zu einem manchmal langsamen/hängenden
          # Ubuntu-Mirror.
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -q \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Update prices
        env:
          ASSET_CLASS: ${{ github.event.inputs.asset_class }}
          ISIN: ${{ github.event.inputs.isin }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=()
          [ -n "$ASSET_CLASS" ] && ARGS+=(--asset-class "$ASSET_CLASS")
          [ -n "$ISIN" ] && ARGS+=(--isin "$ISIN")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          echo "Starte Kurs-Update (${ARGS[*]:-alle Asset-Klassen})"
          python manage.py update_prices "${ARGS[@]}"

      - name: Ausstehende Preis-Alarm-Telegram-Nachrichten nachholen
        if: always()  # läuft auch, wenn "Update prices" fehlschlägt — holt trotzdem alte Rückstände nach
        run: |
          # Dieser Runner hat keine TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID (bewusst,
          # um den Bot-Token nicht zusätzlich als GitHub-Secret zu duplizieren).
          # Der Versand läuft daher über die Live-App, die die Telegram-Config schon hat.
          curl -s -X POST -H "X-Api-Key: $FINTECH_API_KEY" --max-time 40 https://littlecapa.com/fintech/notify-price-alarms/ \
            && echo "" \
            || echo "notify-price-alarms fehlgeschlagen (ignoriert)."

      - name: SCBB-Erreichbarkeits-Check anstoßen
        if: always()  # läuft auch, wenn "Update prices" fehlschlägt — unabhängiges Anliegen
        run: |
          if curl -s -o /dev/null -w '%{http_code}' -X POST --max-time 40 https://littlecapa.com/scbb/check/ | grep -q '^2'; then
            echo "SCBB-Check ausgelöst."
          else
            echo "SCBB-Check fehlgeschlagen (ignoriert)."
          fi

name: 'Weekly: Update ETF Holdings'

on:
  schedule:
    - cron: '0 6 * * 1'  # Montags 06:00 UTC — Fonds-Zusammensetzung ändert sich selten
  workflow_dispatch:
    inputs:
      isin:
        description: 'Nur einen bestimmten Fonds aktualisieren (leer = alle gehaltenen)'
        required: false
        type: string

jobs:
  update-etf-holdings:
    name: 'ETF-Holdings aktualisieren'
    runs-on: ubuntu-latest

    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      SQL_SERVER: lcsqlserver-live
      SQL_RG: RG_LC
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: azureproject.production
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FINTECH_API_KEY: ${{ secrets.FINTECH_API_KEY }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      # GitHub-Runner laufen nicht mehr nur in Azure (z.B. 3.42.157.x = AWS) —
      # "AllowAzureServices" reicht dann nicht. Daher die aktuelle Runner-IP
      # für die Dauer des Laufs in der SQL-Firewall freischalten.
      - name: Azure Login (für SQL-Firewall-Regel)
        uses: azure/login@v3.0.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Runner-IP in SQL-Firewall freischalten
        run: |
          IP=$(curl -fsS --max-time 15 --retry 3 https://api.ipify.org)
          RULE="gh-runner-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "Runner-IP: $IP → Firewall-Regel $RULE"
          az sql server firewall-rule create -g "$SQL_RG" -s "$SQL_SERVER" -n "$RULE" \
            --start-ip-address "$IP" --end-ip-address "$IP" -o none
          echo "SQL_FW_RULE=$RULE" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: Install ODBC Driver for SQL Server
        run: |
          sudo apt-get update -q
          sudo apt-get install -y curl gnupg
          # apt-key gibt es ab Ubuntu 26.04 nicht mehr → Key als Keyring ablegen;
          # prod.list passend zur Runner-Version (referenziert signed-by=microsoft-prod.gpg).
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo $VERSION_ID)/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Update ETF holdings
        run: |
          if [ -n "${{ github.event.inputs.isin }}" ]; then
            echo "Starte ETF-Holdings-Update für ISIN: ${{ github.event.inputs.isin }}"
            python manage.py update_etf_holdings --isin "${{ github.event.inputs.isin }}"
          else
            echo "Starte ETF-Holdings-Update für alle gehaltenen Fonds"
            python manage.py update_etf_holdings
          fi

      - name: SQL-Firewall-Regel für Runner entfernen
        if: always() && env.SQL_FW_RULE != ''
        run: |
          az sql server firewall-rule delete -g "$SQL_RG" -s "$SQL_SERVER" -n "$SQL_FW_RULE" \
            || echo "Firewall-Regel $SQL_FW_RULE konnte nicht entfernt werden."

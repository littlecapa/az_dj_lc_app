{% extends "homepage/base_home.html" %}
{% load static %}

{% block title %}Chess – Littlecapa{% endblock %}

{% block content %}
<style>
    /* ── Chess Board ─────────────────────────────────────────── */
    .chess-hero {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 0;
        gap: 3rem;
        flex-wrap: wrap;
    }

    .chessboard-img {
        width: min(480px, 90vw);
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0,0,0,.25);
        flex-shrink: 0;
        object-fit: cover;
    }

    /* ── Circles ─────────────────────────────────────────────── */
    .chess-circles {
        padding: 2rem 0 3rem;
    }

    .chess-circle-img {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        background: #e9ecef;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        margin: 0 auto 1rem;
        box-shadow: 0 4px 15px rgba(0,0,0,.1);
        transition: transform .3s;
        overflow: hidden;
    }
    .chess-circle-img:hover { transform: scale(1.05); }

    .chess-circle-placeholder {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: linear-gradient(135deg, #e9ecef, #dee2e6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3.5rem;
        margin: 0 auto 1rem;
        box-shadow: 0 4px 15px rgba(0,0,0,.1);
        transition: transform .3s;
        color: #6c757d;
    }
    .chess-circle-placeholder:hover { transform: scale(1.05); }
</style>

<div class="container">

    <!-- ── Hero: Schachbrett ── -->
    <div class="chess-hero">
        <img src="https://www.chess-chivalry.com/cdn/shop/files/Wenge-chessboard-title-slider.webp?v=1674932529&width=3840"
             alt="Chess board"
             class="chessboard-img">
    </div>

    <!-- ── 3 Circles ── -->
    <div class="chess-circles">
        <div class="row text-center">
            <div class="col-md-4 mb-4">
                <img src="{% static 'chess/img/board_to_fen.png' %}"
                     alt="Board to FEN"
                     style="width:180px;height:180px;display:block;margin:0 auto 1rem;
                            transition:transform .3s;"
                     onmouseover="this.style.transform='scale(1.05)'"
                     onmouseout="this.style.transform='scale(1)'">
                <h4>Board <span style="font-size:1.3rem">&#10230;</span> FEN</h4>
                <p class="text-muted small px-3">More content will follow here.</p>
            </div>
            <div class="col-md-4 mb-4">
                <div class="chess-circle-placeholder">♞</div>
                <h4>Solve it</h4>
                <p class="text-muted small px-3">More content will follow here.</p>
            </div>
            <div class="col-md-4 mb-4">
                <div class="chess-circle-placeholder">♜</div>
                <h4 class="text-muted">Coming soon</h4>
                <p class="text-muted small px-3">More content will follow here.</p>
            </div>
        </div>
    </div>

</div>

{% endblock %}

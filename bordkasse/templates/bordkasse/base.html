{% load static %}<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}Bordkasse{% endblock %} – Littlecapa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'bordkasse/bordkasse.css' %}">
</head>
<body>
<div class="wrap">
  {% block content %}{% endblock %}
  <footer>
    Bordkasse &amp; Einkaufsliste · <a href="{% url 'homepage:index' %}">littlecapa.com</a>
    · {% if user.is_authenticated %}angemeldet als {{ user.get_username }}{% else %}<a href="{% url 'homepage:login' %}?next={{ request.get_full_path|urlencode }}">Anmelden</a>{% endif %}
  </footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
